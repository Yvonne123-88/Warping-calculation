<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>整经方案计算器</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:#f5f6f8;color:#1a1a2e;line-height:1.5;padding:16px;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
.container{max-width:1220px;width:100%;background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:18px 20px 26px}
h1{font-size:20px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
h1 svg{width:24px;height:24px;flex-shrink:0}
.row-line{display:flex;align-items:center;gap:5px;padding:4px 8px;border-radius:4px;margin-bottom:3px;flex-wrap:wrap}
.row-line.top{background:#f0f7ff;border:1px solid #dbeafe}
.row-line.bot{background:#fdf2f8;border:1px solid #fce7f3}
.row-label{font-weight:600;font-size:12px;width:26px;flex-shrink:0;text-align:center}
.row-label.top{color:#1e40af}.row-label.bot{color:#9d174d}
.row-line .fg{display:flex;flex-direction:column;gap:1px}
.row-line .fg label{font-size:8px;color:#6b7280;font-weight:500;white-space:nowrap}
.row-line .fg input{padding:2px 3px;border:1px solid #d1d5db;border-radius:2px;font-size:10px;outline:none;width:100%}
.row-line .fg input:focus{border-color:#4f6ef7;box-shadow:0 0 0 2px rgba(79,110,247,.12)}
.row-res{display:flex;gap:4px;flex-shrink:0}
.row-res .item{text-align:right}
.row-res .item .v{font-size:11px;font-weight:700;color:#1e40af}
.row-res .item .lbl{font-size:7px;color:#6b7280}
.row-res .item .warn{color:#dc2626;font-size:8px}
.calc-btn{padding:4px 18px;background:#4f6ef7;color:#fff;border:none;border-radius:4px;font-size:11px;font-weight:500;cursor:pointer;margin:2px 0 3px}
.calc-btn:hover{background:#3b57d9}
.formula-note{margin-top:3px;font-size:9px;color:#9ca3af;line-height:1.3;padding:4px 6px;background:#f9fafb;border-radius:3px;margin-bottom:6px}
.ref-controls{display:flex;gap:6px;margin-bottom:5px;flex-wrap:wrap;align-items:center}
.ref-controls input{flex:1;min-width:120px;font-size:11px;padding:3px 6px;border:1px solid #d1d5db;border-radius:4px;outline:none}
.ref-controls select{font-size:11px;padding:3px 6px;border:1px solid #d1d5db;border-radius:4px;outline:none}
.ref-controls input:focus,.ref-controls select:focus{border-color:#4f6ef7;box-shadow:0 0 0 3px rgba(79,110,247,.15)}
.ref-count{font-size:10px;color:#6b7280;margin-left:auto;white-space:nowrap}
.ref-wrap{max-height:450px;overflow-y:auto;border:1px solid #e5e7eb;border-radius:4px}
.ref-table{width:100%;border-collapse:collapse;font-size:10px}
.ref-table th{position:sticky;top:0;z-index:2;background:#f3f4f6;text-align:left;padding:2px 3px;font-weight:600;color:#374151;font-size:9px;border-bottom:1px solid #d1d5db}
.ref-table td{padding:1px 3px;border-bottom:1px solid #f0f0f0;white-space:nowrap}
.ref-table tr{cursor:pointer}
.ref-table tr:hover td{background:#f0f4ff}
.ref-table .ws-head td{font-weight:700;color:#1e40af;background:#eef2ff!important;padding:2px 3px;cursor:default}
.badge{display:inline-block;font-size:8px;font-weight:600;padding:1px 3px;border-radius:4px}
.badge-top{background:#dbeafe;color:#1e3a5f}
.badge-bot{background:#fce7f3;color:#831843}
.click-hint{font-size:9px;color:#9ca3af;display:block;margin-top:2px}
.footnote{margin-top:8px;padding-top:6px;border-top:1px solid #e9ecef;font-size:10px;color:#9ca3af;line-height:1.5}
@media(max-width:700px){body{padding:8px}.container{padding:10px 8px}}
</style>
</head>

<div class="container">
<h1><svg viewBox="0 0 24 24" fill="none" stroke="#4f6ef7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>整经方案计算器</h1>

<div class="row-line top">
<div class="row-label top"><b>T</b></div>
<div class="fg" style="max-width:68px"><label>整经长度</label><input type="number" id="tWarpLen" step="0.1" value="3400"></div>
<div class="fg" style="max-width:44px"><label>经盘数</label><input type="number" id="tBeamCnt" step="1" value="56"></div>
<div class="fg" style="max-width:54px"><label>最大经长</label><input type="number" id="tMaxWL" step="0.1" value="3400"></div>
<div class="fg" style="max-width:48px"><label>线轴数</label><input type="number" id="tSpool" step="1" value="508"></div>
<div class="fg" style="max-width:38px"><label>上架次</label><input type="number" id="tTimes" step="1" value="2"></div>
<div class="fg" style="max-width:38px"><label>轴余量</label><input type="number" id="tSpoolRem" step="0.1" value="4"></div>
<div class="fg" style="max-width:48px"><label>经长余量</label><input type="number" id="tLenRem" step="0.1" value="200"></div>
<div class="row-res">
<div class="item"><div class="lbl">线轴长</div><div class="v" id="tLenRes">—</div></div>
<div class="item" style="border-left:1px solid #ddd;padding-left:4px"><div class="lbl">订购线轴</div><div class="v" id="tOrderRes">—</div></div>
<div class="item" style="border-left:1px solid #ddd;padding-left:4px"><div class="lbl">线轴数</div><div class="v" id="tSpoolRes">—</div></div>
</div></div>

<div class="row-line bot">
<div class="row-label bot"><b>B</b></div>
<div class="fg" style="max-width:68px"><label>整经长度</label><input type="number" id="bWarpLen" step="0.1" value="3400"></div>
<div class="fg" style="max-width:44px"><label>经盘数</label><input type="number" id="bBeamCnt" step="1" value="56"></div>
<div class="fg" style="max-width:54px"><label>最大经长</label><input type="number" id="bMaxWL" step="0.1" value="3400"></div>
<div class="fg" style="max-width:48px"><label>线轴数</label><input type="number" id="bSpool" step="1" value="508"></div>
<div class="fg" style="max-width:38px"><label>上架次</label><input type="number" id="bTimes" step="1" value="2"></div>
<div class="fg" style="max-width:38px"><label>轴余量</label><input type="number" id="bSpoolRem" step="0.1" value="4"></div>
<div class="fg" style="max-width:48px"><label>经长余量</label><input type="number" id="bLenRem" step="0.1" value="200"></div>
<div class="row-res">
<div class="item"><div class="lbl">线轴长</div><div class="v" id="bLenRes">—</div></div>
<div class="item" style="border-left:1px solid #ddd;padding-left:4px"><div class="lbl">订购线轴</div><div class="v" id="bOrderRes">—</div></div>
<div class="item" style="border-left:1px solid #ddd;padding-left:4px"><div class="lbl">线轴数</div><div class="v" id="bSpoolRes">—</div></div>
</div></div>

<div class="row-line" style="background:#f0fdf4;border:1px solid #bbf7d0">
<div class="row-label" style="width:52px;color:#166534;font-size:10px;flex-shrink:0"><b>调用</b></div>
<div class="fg" style="max-width:68px"><label>订购线轴长</label><input type="number" id="cOrderLen" step="0.1" value="0"></div>
<div class="fg" style="max-width:44px"><label>线轴数</label><input type="number" id="cSpoolQty" step="1" value="0"></div>
<div class="fg" style="max-width:44px"><label>经盘数</label><input type="number" id="cBeamCnt" step="1" value="0"></div>
<div class="fg" style="max-width:48px"><label>线轴数</label><input type="number" id="cSpool" step="1" value="0"></div>
<div class="fg" style="max-width:38px"><label>上架次</label><input type="number" id="cTimes" step="1" value="0"></div>
<div class="row-res"><div class="item"><div class="lbl">整经长</div><div class="v" id="cWarpLenRes">—</div></div></div></div>

<div class="row-line" style="background:#fef2f2;border:1px solid #fecaca">
<div class="row-label" style="width:52px;color:#991b1b;font-size:10px;flex-shrink:0"><b>损耗</b></div>
<div class="fg" style="max-width:48px"><label>单筒重量</label><input type="number" id="dWeight" step="0.01" value="0"></div>
<div class="fg" style="max-width:54px"><label>最大线轴长</label><input type="number" id="dMaxSL" step="1" value="0"></div>
<div class="fg" style="max-width:48px"><label>单价</label><input type="number" id="dPrice" step="0.01" value="0"></div>
<div class="fg" style="max-width:48px"><label>损耗长度</label><input type="number" id="dLossLen" step="1" value="0"></div>
<div class="fg" style="max-width:44px"><label>轴数</label><input type="number" id="dSpoolQty" step="1" value="0"></div>
<div class="row-res">
<div class="item"><div class="lbl">损耗重量</div><div class="v" id="dLossWtRes">—</div></div>
<div class="item" style="border-left:1px solid #ddd;padding-left:4px"><div class="lbl">成本</div><div class="v" id="dCostRes">—</div></div></div></div>

<button class="calc-btn" id="calcBtn">计算</button>
<div class="formula-note">
T/B:线轴长=经长×经盘数 | 订购线轴=线轴长/上架次+经长余量×上架次 | 线轴数量=(线轴数+轴余量)×上架次<br>
调用:整经长=(订购-200×上架次)×上架次/经盘数 | 损耗重量=单筒重/最大线轴长×损耗长×轴数 | 成本=单价×损耗重量
</div>

<div style="font-size:11px;font-weight:600;color:#5b6777;margin-bottom:5px;padding-bottom:3px;border-bottom:1px solid #e9ecef">⑥ 整经数据参考表 — 点击行全部填入</div>
<div class="ref-controls">
<input type="text" id="refSearch" placeholder="搜 WarpSet 或 Loom...">
<select id="refFilter"><option value="">全部 WS</option></select>
<span class="ref-count" id="refCount"></span>
</div>

</div>
<span class="click-hint">💡 点击自动填入所有可用字段</span>
<div class="footnote">数据来源：整经数据.xlsx</div>
</div>

function fm(x){return Number(x).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:0})}
function calc(){
  function cr(w,b,s,t,sr,lr,lo,oo,so){
    var wl=parseFloat(document.getElementById(w).value)||0,bc=parseFloat(document.getElementById(b).value)||0;
    var sp=parseFloat(document.getElementById(s).value)||0,ti=parseFloat(document.getElementById(t).value)||0;
    var sr2=parseFloat(document.getElementById(sr).value)||0,lr2=parseFloat(document.getElementById(lr).value)||0;
    if(!wl||!bc||!ti){document.getElementById(lo).textContent='—';document.getElementById(oo).textContent='—';document.getElementById(so).textContent='—';return}
    var len=wl*bc;
    document.getElementById(lo).textContent=fm(len);
    document.getElementById(oo).textContent=fm(len/ti+lr2*ti);
    document.getElementById(so).textContent=fm((sp+sr2)*ti)
  }
  cr('tWarpLen','tBeamCnt','tSpool','tTimes','tSpoolRem','tLenRem','tLenRes','tOrderRes','tSpoolRes');
  cr('bWarpLen','bBeamCnt','bSpool','bTimes','bSpoolRem','bLenRem','bLenRes','bOrderRes','bSpoolRes');

  var cb=parseFloat(document.getElementById('cBeamCnt').value)||0;
  var ct=parseFloat(document.getElementById('cTimes').value)||0;
  document.getElementById('cWarpLenRes').textContent=ct&&cb?fm((cl-200*ct)*ct/cb):'—';
  var dw=parseFloat(document.getElementById('dWeight').value)||0;
  var dm=parseFloat(document.getElementById('dMaxSL').value)||0;
  var dp=parseFloat(document.getElementById('dPrice').value)||0;
  var dl=parseFloat(document.getElementById('dLossLen').value)||0;
  var dq=parseFloat(document.getElementById('dSpoolQty').value)||0;
  document.getElementById('dLossWtRes').textContent=dm?fm(dw/dm*dl*dq):'—';
  document.getElementById('dCostRes').textContent=dm&&dp?fm(dp*(dw/dm*dl*dq)):'—'
}
