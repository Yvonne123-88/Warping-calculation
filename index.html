<title>整经方案计算器</title>

.param-row .fg label{font-size:11px;color:#6b7280;font-weight:500}
.param-row .fg input{padding:7px 9px;border:1px solid #d1d5db;border-radius:5px;font-size:13px;outline:none;width:100%}
.param-row .fg input:focus{border-color:#4f6ef7;box-shadow:0 0 0 2px rgba(79,110,247,.13)}
.row-line{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:6px;margin-bottom:7px;flex-wrap:wrap}
.row-line.top{background:#f0f7ff;border:1px solid #dbeafe}
.row-line.bot{background:#fdf2f8;border:1px solid #fce7f3}
.row-label{font-weight:600;font-size:14px;width:40px;flex-shrink:0;text-align:center}
.row-label.top{color:#1e40af}.row-label.bot{color:#9d174d}
.row-line .fg{display:flex;flex-direction:column;gap:2px;flex:1;min-width:80px}
.row-line .fg label{font-size:10px;color:#6b7280;font-weight:500;white-space:nowrap}
.row-line .fg input{padding:5px 7px;border:1px solid #d1d5db;border-radius:4px;font-size:13px;outline:none;width:100%}
.row-line .fg input:focus{border-color:#4f6ef7;box-shadow:0 0 0 2px rgba(79,110,247,.12)}
.row-res{display:flex;gap:12px;flex-shrink:0}
.row-res .item{text-align:right}
.row-res .item .v{font-size:16px;font-weight:700;color:#1e40af}
.row-res .item .lbl{font-size:10px;color:#6b7280}
.row-res .item .warn{color:#dc2626;font-size:11px}
.calc-btn{padding:8px 28px;background:#4f6ef7;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer}
.calc-btn:hover{background:#3b57d9}
.formula-note{margin-top:10px;font-size:12px;color:#9ca3af;line-height:1.5;padding:8px 12px;background:#f9fafb;border-radius:4px}
.ref-controls{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.ref-controls input{flex:1;min-width:140px;font-size:13px;padding:6px 10px;border:1px solid #d1d5db;border-radius:6px;outline:none}
.ref-controls select{font-size:13px;padding:6px 10px;border:1px solid #d1d5db;border-radius:6px;outline:none}
.ref-controls input:focus,.ref-controls select:focus{border-color:#4f6ef7;box-shadow:0 0 0 3px rgba(79,110,247,.15)}
.ref-count{font-size:12px;color:#6b7280;margin-left:auto;white-space:nowrap}
.ref-wrap{max-height:480px;overflow-y:auto;border:1px solid #e5e7eb;border-radius:6px}
.ref-table{width:100%;border-collapse:collapse;font-size:12px}
.ref-table th{position:sticky;top:0;z-index:2;background:#f3f4f6;text-align:left;padding:5px 7px;font-weight:600;color:#374151;font-size:11px;border-bottom:1px solid #d1d5db}
.ref-table td{padding:4px 7px;border-bottom:1px solid #f0f0f0}
.ref-table tr{cursor:pointer}

.click-hint{font-size:11px;color:#9ca3af;display:block;margin-top:4px}
.footnote{margin-top:16px;padding-top:12px;border-top:1px solid #e9ecef;font-size:12px;color:#9ca3af;line-height:1.6}

</head>

<div class="container">
<h1>
<svg viewBox="0 0 24 24" fill="none" stroke="#4f6ef7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
整经方案计算器
</h1>
<div class="section">
<div class="section-title">① 计算参数</div>
<div class="param-row">
<div class="fg"><label>整经长度 <span style="color:#888">(米)</span></label><input type="number" id="warpLen" min="0.01" step="0.1" value="3400"></div>
<div class="fg"><label>经盘数量 <span style="color:#888">(个)</span></label><input type="number" id="beamCnt" min="1" step="1" value="56"></div>
<div class="fg"><label>最大整经长度 <span style="color:#888">(米)</span></label><input type="number" id="maxWarpLen" min="0.01" step="0.1" value="3400"></div>
</div>
</div>
<div class="section">
<div class="section-title">② 计算明细</div>
<div class="row-line top">
<div class="row-label top"><b>TOP</b></div>
<div class="fg" style="max-width:90px"><label>上架数</label><input type="number" id="tMount" min="0.01" step="0.01" value="2"></div>
<div class="fg" style="max-width:110px"><label>loom 线轴数量</label><input type="number" id="tSpool" min="0" step="1" value="508"></div>
<div class="fg" style="max-width:90px"><label>上架次数</label><input type="number" id="tTimes" min="0" step="1" value="2"></div>
<div class="row-res">
<div class="item"><div class="lbl">线轴长度</div><div class="v" id="tLenRes">—</div><div class="warn" id="tWarn"></div></div>
<div class="item" style="border-left:1px solid #d1d5db;padding-left:10px"><div class="lbl">线轴数量</div><div class="v" id="tSpoolRes">—</div></div>
</div>
</div>
<div class="row-line bot">
<div class="row-label bot"><b>BOT</b></div>
<div class="fg" style="max-width:90px"><label>上架数</label><input type="number" id="bMount" min="0.01" step="0.01" value="2"></div>
<div class="fg" style="max-width:110px"><label>loom 线轴数量</label><input type="number" id="bSpool" min="0" step="1" value="508"></div>
<div class="fg" style="max-width:90px"><label>上架次数</label><input type="number" id="bTimes" min="0" step="1" value="2"></div>
<div class="row-res">
<div class="item"><div class="lbl">线轴长度</div><div class="v" id="bLenRes">—</div><div class="warn" id="bWarn"></div></div>
<div class="item" style="border-left:1px solid #d1d5db;padding-left:10px"><div class="lbl">线轴数量</div><div class="v" id="bSpoolRes">—</div></div>
</div>
</div>
<button class="calc-btn" id="calcBtn">计算</button>
<div class="formula-note">
<b>公式：</b>线轴长度 = 整经长度 &times; 经盘数量 &times; ceil(上架数) &nbsp;|&nbsp; 线轴数量 = (loom 线轴数量 + 4) &times; 上架次数<br>
线轴长度超过最大整经长度时会标注 ⚠
</div>
</div>
<div class="section">
<div class="section-title">③ 整经数据参考表 — 点击行填入</div>
<div class="ref-controls">
<input type="text" id="refSearch" placeholder="搜索 WarpSet 或物料号...">
<select id="refFilter"><option value="">全部 WarpSet</option></select>
<span class="ref-count" id="refCount"></span>
</div>
<div class="ref-wrap">
<table class="ref-table"><thead><tr><th>物料号</th><th>描述</th><th>WarpSet</th><th>整经长度</th><th>经盘数</th><th>线轴数</th><th>上架次数</th><th>最大经长</th><th>最大线轴长</th></tr></thead><tbody id="refBody"></tbody></table>
</div>
<span class="click-hint">💡 点击行自动填入公共参数和对应行的 loom 线轴数量、上架次数</span>
</div>
<div class="footnote">
数据来源：整经数据.xlsx &nbsp;|&nbsp; Active=Y 为有效数据
</div>
</div>

function renderRef(){
  const q=refSearch.value.trim().toLowerCase(),fw=refFilter.value;
  let f=warpData.filter(d=>(!fw||d[2]===fw)&&(!q||d[2].toLowerCase().includes(q)||d[3].toLowerCase().includes(q)||d[4].toLowerCase().includes(q)));

    g[ws].forEach(d=>{

  const desc=tr.cells[1]?tr.cells[1].textContent:'';
  if(desc.includes('top')||desc.includes('Top')){
    document.getElementById('tSpool').value=spool;document.getElementById('tTimes').value=times
  }else if(desc.includes('bottom')||desc.includes('Bot')){
    document.getElementById('bSpool').value=spool;document.getElementById('bTimes').value=times
  }else{
    document.getElementById('tSpool').value=spool;document.getElementById('tTimes').value=times;
    document.getElementById('bSpool').value=spool;document.getElementById('bTimes').value=times
  }
});
function cef(v){return Math.ceil(v)||0}
function fmt(x){return Number(x).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:0})}
function calc(){
  const wl=parseFloat(document.getElementById('warpLen').value)||0;
  const bc=parseFloat(document.getElementById('beamCnt').value)||0;
  const mwl=parseFloat(document.getElementById('maxWarpLen').value)||0;
  if(!wl||!bc){document.getElementById('tLenRes').textContent='—';document.getElementById('bLenRes').textContent='—';return}
  function cr(mid,sid,tid,lid,srid,wid){
    const m=parseFloat(document.getElementById(mid).value)||0;
    const s=parseFloat(document.getElementById(sid).value)||0;
    const t=parseFloat(document.getElementById(tid).value)||0;
    document.getElementById(lid).textContent=fmt(wl*bc*cef(m));
    document.getElementById(srid).textContent=fmt((s+4)*t);
    document.getElementById(wid).textContent=wl*bc*cef(m)>mwl?'⚠ 超最大整经长度':'';
  }
  cr('tMount','tSpool','tTimes','tLenRes','tSpoolRes','tWarn');
  cr('bMount','bSpool','bTimes','bLenRes','bSpoolRes','bWarn');
}
document.getElementById('calcBtn').addEventListener('click',calc);
document.querySelectorAll('input').forEach(inp=>inp.addEventListener('keydown',e=>{if(e.key==='Enter')calc()}));
calc();
</script>
</body>
