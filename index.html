<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>整经方案计算器</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:#f5f6f8;color:#1a1a2e;line-height:1.5;padding:16px;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
.container{max-width:1200px;width:100%;background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:24px 28px 32px}
h1{font-size:20px;font-weight:600;margin-bottom:20px;display:flex;align-items:center;gap:8px}
h1 svg{width:24px;height:24px;flex-shrink:0}
.section{margin-bottom:18px}
.section-title{font-size:13px;font-weight:600;color:#5b6777;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #e9ecef}
.layout{display:flex;gap:28px;align-items:flex-start}
.layout-left{flex:0 0 420px;min-width:0}
.layout-right{flex:1;min-width:0}
.row-common{display:flex;gap:12px;flex-wrap:wrap}
.row-common .fg{flex:1;min-width:100px}
.row-line{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;margin-bottom:6px}
.row-line.top{background:#f0f7ff;border:1px solid #dbeafe}
.row-line.bot{background:#fdf2f8;border:1px solid #fce7f3}
.row-label{font-weight:600;font-size:14px;width:44px;flex-shrink:0;text-align:center;padding:4px 0}
.row-label.top{color:#1e40af}
.row-label.bot{color:#9d174d}
.row-line .fg{display:flex;flex-direction:column;gap:2px;flex:1}
.row-line .fg label{font-size:11px;color:#6b7280;font-weight:500}
.row-line .fg input{padding:6px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:13px;outline:none;width:100%}
.row-line .fg input:focus{border-color:#4f6ef7;box-shadow:0 0 0 2px rgba(79,110,247,.12)}
.row-result{font-size:14px;font-weight:600;text-align:right;min-width:130px;padding:4px 6px;flex-shrink:0}
.row-result .val{font-size:18px;color:#1e40af}
.calc-btn{margin-top:4px;padding:8px 28px;background:#4f6ef7;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer}
.calc-btn:hover{background:#3b57d9}
.formula-note{margin-top:10px;font-size:12px;color:#9ca3af;line-height:1.5;padding:8px 12px;background:#f9fafb;border-radius:4px}
/* ref table */
.ref-section{margin-top:0}
.ref-controls{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.ref-controls input{flex:1;min-width:140px;font-size:13px;padding:6px 10px;border:1px solid #d1d5db;border-radius:6px;outline:none}
.ref-controls select{font-size:13px;padding:6px 10px;border:1px solid #d1d5db;border-radius:6px;outline:none}
.ref-controls input:focus,.ref-controls select:focus{border-color:#4f6ef7;box-shadow:0 0 0 3px rgba(79,110,247,.15)}
.ref-count{font-size:12px;color:#6b7280;margin-left:auto;white-space:nowrap}
.ref-wrap{max-height:500px;overflow-y:auto;border:1px solid #e5e7eb;border-radius:6px}
.ref-table{width:100%;border-collapse:collapse;font-size:12px}
.ref-table th{position:sticky;top:0;z-index:2;background:#f3f4f6;text-align:left;padding:6px 8px;font-weight:600;color:#374151;font-size:11px;border-bottom:1px solid #d1d5db}
.ref-table td{padding:5px 8px;border-bottom:1px solid #f0f0f0}
.ref-table tr{cursor:pointer}
.ref-table tr:hover td{background:#f0f4ff}
.ref-table .warp-group{cursor:default}
.ref-table .warp-group td{font-weight:700;color:#1e40af;background:#eef2ff!important;padding:4px 8px}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:1px 7px;border-radius:8px}
.badge-top{background:#dbeafe;color:#1e3a5f}
.badge-bot{background:#fce7f3;color:#831843}
.empty-state{padding:28px;text-align:center;color:#9ca3af;font-size:13px}
.click-hint{font-size:11px;color:#9ca3af;display:block;margin-top:4px}
.footnote{margin-top:20px;padding-top:14px;border-top:1px solid #e9ecef;font-size:12px;color:#9ca3af;line-height:1.6}
@media(max-width:960px){.layout{flex-direction:column}.layout-left{flex:1;width:100%}}
@media(max-width:620px){body{padding:10px}.container{padding:16px 12px}.row-line{flex-wrap:wrap}.row-result{min-width:auto;text-align:left}}
</style>
</head>
<body>
<div class="container">
<h1>
<svg viewBox="0 0 24 24" fill="none" stroke="#4f6ef7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
整经方案计算器
</h1>
<div class="layout">
<div class="layout-left">
<div class="section">
<div class="section-title">① 公共参数</div>
<div class="row-common">
<div class="fg"><label>最大整经长度 <span style="color:#888;font-weight:400">(米)</span></label><input type="number" id="maxL" min="0.01" step="0.1" value="3400"></div>
<div class="fg"><label>整经长度 <span style="color:#888;font-weight:400">(米)</span></label><input type="number" id="warpLen" min="0.01" step="0.1" value="3400"></div>
<div class="fg"><label>经盘数量 <span style="color:#888;font-weight:400">(个)</span></label><input type="number" id="beamCnt" min="1" step="1" value="56"></div>
</div>
</div>
<div class="section">
<div class="section-title">② 计算明细</div>
<div class="row-line top">
<div class="row-label top"><b>Top</b></div>
<div class="fg"><label>上架次数</label><input type="number" id="topTimes" min="0" step="1" value="1"></div>
<div class="fg"><label>上架筒子数量</label><input type="number" id="topSpools" min="0" step="1" value="508"></div>
<div class="row-result">线轴长度<br><span class="val" id="topResult">—</span> <span style="font-size:12px;color:#888">米</span></div>
</div>
<div class="row-line bot">
<div class="row-label bot"><b>Bot</b></div>
<div class="fg"><label>上架次数</label><input type="number" id="botTimes" min="0" step="1" value="1"></div>
<div class="fg"><label>上架筒子数量</label><input type="number" id="botSpools" min="0" step="1" value="508"></div>
<div class="row-result">线轴长度<br><span class="val" id="botResult">—</span> <span style="font-size:12px;color:#888">米</span></div>
</div>
<button class="calc-btn" id="calcBtn">计算</button>
<div class="formula-note">
<b>公式：</b>线轴长度 = 整经长度 &times; 经盘数量 + 200 &times; 上架次数<br>
<b>参考：</b>超过最大线轴长度则自动翻倍（&times;2）
</div>
</div>
</div>
<div class="layout-right">
<div class="section ref-section">
<div class="section-title">③ 整经数据参考表 — 点击行填入</div>
<div class="ref-controls">
<input type="text" id="refSearch" placeholder="搜索 WarpSet 或 Loom...">
<select id="refFilter"><option value="">全部 WarpSet</option></select>
<span class="ref-count" id="refCount"></span>
</div>
<div class="ref-wrap" id="refWrap">
<table class="ref-table"><thead><tr><th>PairCode</th><th>Loom</th><th>T/B</th><th>整经长度</th><th>经盘数</th><th>线轴数</th><th>最大线轴长</th></tr></thead><tbody id="refBody"></tbody></table>
</div>
<span class="click-hint">💡 点击行自动填入公共参数</span>
</div>
</div>
</div>
<div class="footnote">
数据来源：整经数据.xlsx（仅显示 Top / Bot 行）。<br>线轴长度超过最大线轴长度时需翻倍，翻倍后若仍超过则标注。
</div>
</div>

// Reference table render
const refBody=document.getElementById('refBody'),refSearch=document.getElementById('refSearch'),refFilter=document.getElementById('refFilter'),refCount=document.getElementById('refCount');
function renderRef(){
  const q=refSearch.value.trim().toLowerCase(),fws=refFilter.value;
  let f=warpData.filter(d=>(!fws||d.ws===fws)&&(!q||d.ws.toLowerCase().includes(q)||d.loom.toLowerCase().includes(q)||d.pair.toLowerCase().includes(q)));
  const g={};f.forEach(d=>{if(!g[d.ws])g[d.ws]=[];g[d.ws].push(d)});
  const ks=Object.keys(g).sort();
  refCount.textContent=f.length+' 条';
  let h='';
  ks.forEach(ws=>{
    h+='<tr class="warp-group"><td colspan="7"><span class="warp-label">'+ws+'</span></td></tr>';
    g[ws].forEach(d=>{
      const tc=d.tb==='Top'?'badge-top':'badge-bot';
      h+='<tr data-len="'+d.len+'" data-beam="'+d.beam+'" data-spool="'+d.spool+'" data-maxy="'+d.maxY+'" data-maxl="'+d.maxL+'" data-tb="'+d.tb+'">';
      h+='<td>'+d.pair+'</td><td>'+d.loom+'</td><td><span class="badge '+tc+'">'+d.tb.slice(0,1)+'</span></td><td>'+d.len+'</td><td>'+d.beam+'</td><td>'+d.spool+'</td><td>'+d.maxY+'</td></tr>'
    })
  });
  refBody.innerHTML=f.length?h:'<tr><td colspan="7" class="empty-state">无匹配数据</td></tr>'
}
const wsSet=Array.from(new Set(warpData.map(d=>d.ws))).sort();
wsSet.forEach(ws=>{const o=document.createElement('option');o.value=ws;o.textContent=ws;refFilter.appendChild(o)});
refSearch.addEventListener('input',renderRef);refFilter.addEventListener('change',renderRef);renderRef();
// Click ref row to fill
refBody.addEventListener('click',function(e){
  const tr=e.target.closest('tr');
  if(!tr||!tr.dataset.len)return;
  document.getElementById('maxL').value=tr.dataset.maxl;
  document.getElementById('warpLen').value=tr.dataset.len;
  document.getElementById('beamCnt').value=tr.dataset.beam;
});
// Calculator logic
const fmt=x=>Number(x).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
function calcOne(times,spools,warpLen,beamCnt,maxL){
  const base=warpLen*beamCnt+200*times;
  let doubled=false;
  let total=base;
  if(base>maxL){total=base*2;doubled=true}
  return{total,doubled,base}
}
function fmtResult(r){
  let s=fmt(r.total)+' 米';
  if(r.doubled)s+=' <span style="color:#dc2626;font-size:11px">(翻倍)</span>';
  return s
}
function calc(){
  const warpLen=parseFloat(document.getElementById('warpLen').value)||0;
  const beamCnt=parseFloat(document.getElementById('beamCnt').value)||0;
  const maxL=parseFloat(document.getElementById('maxL').value)||0;
  const tTimes=parseFloat(document.getElementById('topTimes').value)||0;
  const tSpools=parseFloat(document.getElementById('topSpools').value)||0;
  const bTimes=parseFloat(document.getElementById('botTimes').value)||0;
  const bSpools=parseFloat(document.getElementById('botSpools').value)||0;
  if(!warpLen||!beamCnt||!maxL){document.getElementById('topResult').innerHTML='<span style="color:#dc2626">请填参数</span>';document.getElementById('botResult').innerHTML='<span style="color:#dc2626">请填参数</span>';return}
  const rTop=calcOne(tTimes,tSpools,warpLen,beamCnt,maxL);
  const rBot=calcOne(bTimes,bSpools,warpLen,beamCnt,maxL);
  document.getElementById('topResult').innerHTML=fmtResult(rTop);
  document.getElementById('botResult').innerHTML=fmtResult(rBot);
}
document.getElementById('calcBtn').addEventListener('click',calc);
document.querySelectorAll('input').forEach(inp=>inp.addEventListener('keydown',e=>{if(e.key==='Enter')calc()}));
calc();
