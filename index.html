.row-line{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:5px;margin-bottom:5px;flex-wrap:wrap}
.row-line.top{background:#f0f7ff;border:1px solid #dbeafe}
.row-line.bot{background:#fdf2f8;border:1px solid #fce7f3}
.row-label{font-weight:600;font-size:13px;width:36px;flex-shrink:0;text-align:center}
.row-label.top{color:#1e40af}.row-label.bot{color:#9d174d}
.row-line .fg{display:flex;flex-direction:column;gap:1px;flex:1;min-width:80px}
.row-line .fg label{font-size:10px;color:#6b7280;font-weight:500;white-space:nowrap}
.row-line .fg input{padding:4px 6px;border:1px solid #d1d5db;border-radius:3px;font-size:12px;outline:none;width:100%}
.row-line .fg input:focus{border-color:#4f6ef7;box-shadow:0 0 0 2px rgba(79,110,247,.12)}
.row-res{display:flex;gap:8px;flex-shrink:0}
.row-res .item{text-align:right}
.row-res .item .v{font-size:14px;font-weight:700;color:#1e40af}
.row-res .item .lbl{font-size:9px;color:#6b7280}
.row-res .item .warn{color:#dc2626;font-size:10px}
.calc-btn{padding:6px 24px;background:#4f6ef7;color:#fff;border:none;border-radius:5px;font-size:13px;font-weight:500;cursor:pointer}
.calc-btn:hover{background:#3b57d9}
.formula-note{margin-top:6px;font-size:11px;color:#9ca3af;line-height:1.4;padding:6px 10px;background:#f9fafb;border-radius:4px}
.ref-controls{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.ref-controls input{flex:1;min-width:140px;font-size:12px;padding:5px 8px;border:1px solid #d1d5db;border-radius:5px;outline:none}
.ref-controls select{font-size:12px;padding:5px 8px;border:1px solid #d1d5db;border-radius:5px;outline:none}
.ref-controls input:focus,.ref-controls select:focus{border-color:#4f6ef7;box-shadow:0 0 0 3px rgba(79,110,247,.15)}
.ref-count{font-size:11px;color:#6b7280;margin-left:auto;white-space:nowrap}
.ref-wrap{max-height:500px;overflow-y:auto;border:1px solid #e5e7eb;border-radius:5px}
.ref-table{width:100%;border-collapse:collapse;font-size:11px}
.ref-table th{position:sticky;top:0;z-index:2;background:#f3f4f6;text-align:left;padding:3px 4px;font-weight:600;color:#374151;font-size:10px;border-bottom:1px solid #d1d5db}
.ref-table td{padding:2px 4px;border-bottom:1px solid #f0f0f0;white-space:nowrap}

.badge-top{background:#dbeafe;color:#1e3a5f}

.click-hint{font-size:10px;color:#9ca3af;display:block;margin-top:3px}
.footnote{margin-top:12px;padding-top:10px;border-top:1px solid #e9ecef;font-size:11px;color:#9ca3af;line-height:1.5}
.section-title{font-size:12px;font-weight:600;color:#5b6777;letter-spacing:.4px;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid #e9ecef}
.section{margin-bottom:12px}
@media(max-width:700px){body{padding:10px}.container{padding:12px 10px}.row-line{gap:4px}}

</head>

</div></div>
<div class="row-line bot">

<div class="fg" style="max-width:90px"><label>整经长度</label><input type="number" id="bWarpLen" step="0.1" value="3400"></div>

<button class="calc-btn" id="calcBtn">计算</button>

</div>

var D=raw.map(function(r){var p=r.split('|');return p});
var rb=document.getElementById('refBody'),rs=document.getElementById('refSearch'),rf=document.getElementById('refFilter'),rc=document.getElementById('refCount');
function render(){
  var q=rs.value.trim().toLowerCase(),fw=rf.value;
  var f=D.filter(function(d){return d[2]==='Y'&&(!fw||d[3]===fw)&&(!q||d[3].toLowerCase().includes(q)||d[1].toLowerCase().includes(q)||d[4].toLowerCase().includes(q))});
  var g={};f.forEach(function(d){if(!g[d[3]])g[d[3]]=[];g[d[3]].push(d)});
  var ks=Object.keys(g).sort();rc.textContent=f.length+' 条';var h='';
  ks.forEach(function(ws){
    h+='<tr class="ws-head"><td colspan="13"><span style="font-weight:700;font-size:13px">'+ws+'</span></td></tr>';
    g[ws].forEach(function(d){
      var tb=d[0],mk=d[4].includes('marker');
      var tbc=tb==='Top'?'<span class="badge badge-top">T</span>':tb==='Bot'?'<span class="badge badge-bot">B</span>':'';
      h+='<tr'+(mk?' style="opacity:.5"':'')+' data-tb="'+tb+'" data-len="'+d[6]+'" data-beams="'+d[7]+'" data-spools="'+d[8]+'" data-times="'+d[9]+'" data-mxl="'+d[5]+'">';
      h+='<td>'+tbc+'</td><td>'+d[1]+'</td><td>'+d[3]+'</td><td>'+d[4]+'</td><td>'+d[6]+'</td><td>'+d[7]+'</td><td>'+d[8]+'</td><td>'+d[9]+'</td><td>'+d[10]+'</td><td>'+d[11]+'</td><td>'+d[12]+'</td><td>'+d[13]+'</td><td>'+d[14]+'</td></tr>'
    })
  });
  rb.innerHTML=f.length?h:'<tr><td colspan="13" style="padding:28px;text-align:center;color:#9ca3af">无匹配</td></tr>'
}
var wsArr=[];D.forEach(function(d){var w=d[3];if(wsArr.indexOf(w)<0)wsArr.push(w)});wsArr.sort();
wsArr.forEach(function(ws){var o=document.createElement('option');o.value=ws;o.textContent=ws;rf.appendChild(o)});
rs.addEventListener('input',render);rf.addEventListener('change',render);render();
rb.addEventListener('click',function(e){
  var tr=e.target.closest('tr');if(!tr||!tr.dataset.beams)return;
document.getElementById('tWarpLen').value=tr.dataset.len;
document.getElementById('tBeamCnt').value=tr.dataset.beams;
document.getElementById('tMaxWL').value=tr.dataset.mxl;
document.getElementById('bWarpLen').value=tr.dataset.len;
document.getElementById('bBeamCnt').value=tr.dataset.beams;
document.getElementById('bMaxWL').value=tr.dataset.mxl;
var sp=tr.dataset.spools,ti=tr.dataset.times,tb=tr.dataset.tb;
if(tb==='Top'){document.getElementById('tSpool').value=sp;document.getElementById('tTimes').value=ti}
else if(tb==='Bot'){document.getElementById('bSpool').value=sp;document.getElementById('bTimes').value=ti}
else{document.getElementById('tSpool').value=sp;document.getElementById('tTimes').value=ti;document.getElementById('bSpool').value=sp;document.getElementById('bTimes').value=ti}
function fm(x){return Number(x).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:0})}
function calc(){
  var wl=parseFloat(document.getElementById('warpLen').value)||0,bc=parseFloat(document.getElementById('beamCnt').value)||0,mwl=parseFloat(document.getElementById('maxWarpLen').value)||0;
  if(!wl||!bc){document.getElementById('tLenRes').textContent='—';document.getElementById('bLenRes').textContent='—';return}
function calc(){
  function cr(wid,bid,sid,tid,lid,srid,oid,warnid){
    var wl=parseFloat(document.getElementById(wid).value)||0;
    var bc=parseFloat(document.getElementById(bid).value)||0;
    var mwl=parseFloat(document.getElementById(wid.replace('WarpLen','MaxWL')).value)||0;
    var s=parseFloat(document.getElementById(sid).value)||0,t=parseFloat(document.getElementById(tid).value)||0;
    if(!wl||!bc){document.getElementById(lid).textContent='—';document.getElementById(srid).textContent='—';document.getElementById(oid).textContent='—';return}
    var len=wl*(bc+4)*t;
    document.getElementById(lid).textContent=fm(len);
    document.getElementById(srid).textContent=fm((s+4)*t);
    document.getElementById(oid).textContent=fm(t>0?len/t+200*t:0);
    document.getElementById(warnid).textContent=wl>mwl?'⚠ 超':''
  }
  cr('tWarpLen','tBeamCnt','tSpool','tTimes','tLenRes','tSpoolRes','tOrderRes','tWarn');
  cr('bWarpLen','bBeamCnt','bSpool','bTimes','bLenRes','bSpoolRes','bOrderRes','bWarn')
}
document.getElementById('calcBtn').addEventListener('click',calc);
document.querySelectorAll('input').forEach(function(i){i.addEventListener('keydown',function(e){if(e.key==='Enter')calc()})});
calc();
</script>
